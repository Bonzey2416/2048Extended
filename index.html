<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>2048 Extended</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aquawolf04/font-awesome-pro@5cd1511/css/all.css"  crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <main class="game-container">
            <section class="header">
                <h1 class="title">2048 Extended <span class="beta">Beta</span></h1>
                <p>Join the numbers and get to the 2048 tile!</p>
            </section>
            <section class="game-board">
                <div class="grid-container">
                    <div class="grid-container-inner">
                        <div class="grid-cell" id="cell-0-0"></div>
                        <div class="grid-cell" id="cell-0-1"></div>
                        <div class="grid-cell" id="cell-0-2"></div>
                        <div class="grid-cell" id="cell-0-3"></div>
                        <div class="grid-cell" id="cell-1-0"></div>
                        <div class="grid-cell" id="cell-1-1"></div>
                        <div class="grid-cell" id="cell-1-2"></div>
                        <div class="grid-cell" id="cell-1-3"></div>
                        <div class="grid-cell" id="cell-2-0"></div>
                        <div class="grid-cell" id="cell-2-1"></div>
                        <div class="grid-cell" id="cell-2-2"></div>
                        <div class="grid-cell" id="cell-2-3"></div>
                        <div class="grid-cell" id="cell-3-0"></div>
                        <div class="grid-cell" id="cell-3-1"></div>
                        <div class="grid-cell" id="cell-3-2"></div>
                        <div class="grid-cell" id="cell-3-3"></div>
                    </div>
                    <div class="tile-container" id="tile-container">
                        <div class="game-over-container hidden" id="game-over-container">
                            <div class="game-over-message">
                                <p>Game Over!</p>
                                <button id="restart-button">Restart</button>
                            </div>
                        </div>
                        <div class="game-won-container hidden" id="game-won-container">
                            <div class="game-won-message">
                                <p>You Won!</p>
                                <button id="game-won-keep-going">Keep Going</button>
                                <button id="game-won-restart">Restart</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="details-container">
                <div class="score-container">
                    <div class="score">
                        <h2>Score</h2>
                        <p id="score">0</p>
                    </div>
                    <div class="best-score">
                        <h2>Best Score</h2>
                        <p id="best-score">0</p>
                    </div>
                </div>
                <div class="button-container">
                    <button id="undo-button" title="Undo (Ctrl+Z)"><i class="fas fa-undo"></i> Undo</button>
                    <button id="redo-button" title="Redo (Ctrl+Y)"><i class="fas fa-redo"></i> Redo</button>
                    <button id="reset-button" title="Reset Game"><i class="fas fa-sync-alt"></i> Reset</button>
                </div>
                <p>Version 0.2; last updated 2025-09-25</p>
            </section>
        </main>
    </body>
</html>
