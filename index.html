<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>2048 Extended</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aquawolf04/font-awesome-pro@5cd1511/css/all.css"  crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <main class="game-container">
            <section class="header">
                <h1 class="title">2048 Extended <span class="beta">Beta</span></h1>
                <p>Join the numbers and get to the <span class="goal-number">2048</span> tile!</p>
            </section>
            <section class="game-board">
                <div class="grid-container">
                    <div class="grid-container-inner" id="grid-container-inner">
                        <div class="grid-cell" id="cell-0-0"></div>
                        <div class="grid-cell" id="cell-0-1"></div>
                        <div class="grid-cell" id="cell-0-2"></div>
                        <div class="grid-cell" id="cell-0-3"></div>
                        <div class="grid-cell" id="cell-1-0"></div>
                        <div class="grid-cell" id="cell-1-1"></div>
                        <div class="grid-cell" id="cell-1-2"></div>
                        <div class="grid-cell" id="cell-1-3"></div>
                        <div class="grid-cell" id="cell-2-0"></div>
                        <div class="grid-cell" id="cell-2-1"></div>
                        <div class="grid-cell" id="cell-2-2"></div>
                        <div class="grid-cell" id="cell-2-3"></div>
                        <div class="grid-cell" id="cell-3-0"></div>
                        <div class="grid-cell" id="cell-3-1"></div>
                        <div class="grid-cell" id="cell-3-2"></div>
                        <div class="grid-cell" id="cell-3-3"></div>
                    </div>
                    <div class="tile-container" id="tile-container">
                        <div class="game-over-container hidden" id="game-over-container">
                            <div class="game-over-message">
                                <p>Game Over!</p>
                                <button id="restart-button">Restart</button>
                            </div>
                        </div>
                        <div class="game-won-container hidden" id="game-won-container">
                            <div class="game-won-message">
                                <p>You Won!</p>
                                <button id="game-won-keep-going">Keep Going</button>
                                <button id="game-won-restart">Restart</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="details-container">
                <div class="score-container">
                    <div class="score">
                        <h2>Score</h2>
                        <p id="score">0</p>
                    </div>
                    <div class="best-score">
                        <h2>Best Score</h2>
                        <p id="best-score">0</p>
                    </div>
                </div>
                <div class="button-container">
                    <button id="undo-button" title="Undo (Ctrl+Z)"><i class="fas fa-undo"></i> Undo</button>
                    <button id="redo-button" title="Redo (Ctrl+Y)"><i class="fas fa-redo"></i> Redo</button>
                    <button id="reset-button" title="Reset Game"><i class="fas fa-sync-alt"></i> Reset</button>
                    <button id="mode-button" title="Change Mode"><i class="fas fa-adjust"></i> Mode</button>
                </div>
                <div class="ai-container">
                    <i class="fas fa-robot"></i>
                    <div class="ai-status" id="ai-status">AI Mode: Off</div>
                    <button id="ai-toggle-button" title="Toggle AI Mode"><i id="ai-toggle-button-icon" class="fas fa-play"></i></button>
                    <button id="ai-option-button" title="AI Options"><i id="ai-options-button-icon" class="fas fa-gear"></i></button>
                </div>
                </div>
                <p>Version 0.6; last updated 2025-09-26</p>
            </section>
        </main>
        <div class="overlay-backdrop hidden" id="overlay-backdrop"></div>
        <div class="overlay-menu hidden" id="modes-menu">
            <i class="fas fa-times close-button" id="close-modes-menu"></i>
            <h2>Select Game Mode</h2>
            <p>Goal: <span class="goal-number">2048</span></p>
            <div class="dropdown-container">
                <label for="game-mode-select">
                    <p class="label-title">Game mode</p>
                    <p class="label-subtitle">Choose the mode for your game</p>
                </label>
                <select id="game-mode-select">
                    <option value="classic" selected>Classic</option>
                    <option value="fibonacci">Fibonacci</option>
                </select>
            </div>
            <div class="dropdown-container">
                <label for="grid-size-select">
                    <p class="label-title">Grid size</p>
                    <p class="label-subtitle">Choose the grid size for your game</p>
                </label>
                <select id="grid-size-select">
                    <option value="3">3x3</option>
                    <option value="4" selected>4x4</option>
                    <option value="5">5x5</option>
                    <option value="6">6x6</option>
                    <option value="7">7x7</option>
                    <option value="8">8x8</option>
                </select>
            </div>
        </div>
        <div class="overlay-menu hidden" id="ai-options-menu">
            <i class="fas fa-times close-button" id="close-ai-options-menu"></i>
            <h2>AI Options</h2>
            <div class="input-container">
                <label for="ai-move-duration-input">
                    <p class="label-title">AI Move Duration</p>
                    <p class="label-subtitle">Set the duration for AI moves in milliseconds</p>
                </label>
                <input type="number" id="ai-move-duration-input" min="0" value="100">
            </div>
        </div>
    </body>
</html>
